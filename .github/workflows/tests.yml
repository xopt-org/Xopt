name: Tests

on:
  pull_request:
  push:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  delete-cancelled-runs:
    permissions:
      actions: write
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'MercuryTechnologies/delete-cancelled-runs@1.0.0'
        with:
          workflow-file: 'tests.yml'
          max-deletions: 3

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Set up MPI
        uses: mpi4py/setup-mpi@v1

      - name: Install dependencies
        run: uv sync --extra dev

      - name: List Python package versions
        run: uv pip list

      - name: Run tests
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: uv run pytest -n auto --cov --cov-branch --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
